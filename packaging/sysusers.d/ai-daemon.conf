# The daemon's own identity, the shim's, and the outer gate.
#
# `ai` is a group of *humans*, not of apps: it answers "may this user talk to
# the daemon at all", which is all a Unix group can answer, and the policy
# engine answers everything else (§4, §5). Enrolment is deliberately left to
# the distro or the admin — a single-user desktop will want the primary user in
# it the way they are in `video`; a shared machine wants it explicit, the way
# `docker` is.
u ai-daemon      - "AI inference service" /var/lib/ai-daemon -
u ai-daemon-shim - "ai-daemon OpenAI-compatible shim" - -
g ai             -

# The remote provider's own identity. Separate from ai-daemon because it is the
# process with a network: it must not be able to read what the daemon writes.
# Its supplementary membership of `ai-daemon` is what lets it be reached
# through a 0660 socket and is the only thing that group buys it here — the
# state directory is not in its namespace at all (see its unit).
u ai-daemon-remote - "ai-daemon remote provider" - -
m ai-daemon-remote ai-daemon
