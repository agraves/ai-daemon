<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for ai-daemon.

  The interim name is deliberate. `org.freedesktop.AI1` is the target (§3), and
  it is earned by taking the spec through freedesktop review rather than
  claimed by shipping under it — a daemon squatting the namespace it wants to
  standardise would poison the review it needs.

  Who may call what, and why:

    * Only the `ai-daemon` user may own the name.
    * Anyone may call the Manager. That is not a loophole: the daemon
      identifies its caller from bus credentials and refuses through the policy
      engine (§5), and a bus-level deny would make every refusal look like
      "the service is missing" rather than "you were not granted this".
    * Session objects are reachable by anyone too, for the same reason — the
      object checks the caller, the bus does not have enough context to.

  The coarse "may this human use local inference at all" question is answered
  by the `ai` group on the daemon's socket (§4), not here.
-->
<busconfig>
  <policy user="ai-daemon">
    <allow own="io.github.agraves.AIDaemon1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.agraves.AIDaemon1"
           send_interface="io.github.agraves.AIDaemon1.Manager"/>
    <allow send_destination="io.github.agraves.AIDaemon1"
           send_interface="io.github.agraves.AIDaemon1.Session"/>
    <allow send_destination="io.github.agraves.AIDaemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.agraves.AIDaemon1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.agraves.AIDaemon1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
