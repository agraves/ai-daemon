# The model store, and the one directory the network-facing helper may write.
#
# Modes are tight because the store is shared: 0755 on models/ so any user can
# see what is installed, 0700 on staging/ because a half-downloaded artifact
# has not been verified yet and nothing should be able to pick it up.
d /var/lib/ai-daemon                    0750 ai-daemon ai-daemon -
d /var/lib/ai-daemon/models             0755 ai-daemon ai-daemon -
d /var/lib/ai-daemon/models/blobs       0755 ai-daemon ai-daemon -
d /var/lib/ai-daemon/models/blobs/sha256 0755 ai-daemon ai-daemon -
d /var/lib/ai-daemon/models/manifests   0755 ai-daemon ai-daemon -
d /var/lib/ai-daemon/models/staging     0700 ai-daemon ai-daemon -
d /run/ai-daemon                        0755 ai-daemon ai-daemon -
