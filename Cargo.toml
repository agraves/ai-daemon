# ai-daemon — a system inference service for desktop Linux.
#
# One workspace, several binaries, because the privilege split in the design
# is a process split: the daemon that sees prompts has no network, the helper
# that has network never sees prompts, and the code that parses attacker-shaped
# media runs somewhere both of those can survive crashing.
[workspace]
resolver = "2"
members = [
    "crates/ai-daemon-proto",
    "crates/ai-daemon",
    "crates/ai-daemon-backend-mock",
    "crates/ai-daemon-backend-llamacpp",
    "crates/ai-daemon-backend-remote",
    "crates/ai-daemon-portal",
    "crates/ai-run",
    "crates/ai-daemon-fetch",
    "crates/ai-daemon-decode",
    "crates/ai-daemon-shim",
    "crates/aidctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Not aspirational: the lockfile decides this. zbus 5.19, zvariant 5.15 and
# zcheapstr 1.1 each declare rust-version = "1.87", so cargo refuses a 1.85
# toolchain before compiling a line of ours — which is how Debian trixie's
# 1.85.0 bounced. A stated minimum the lockfile forbids is a claim that fails
# the first person who relies on it.
#
# The consequence is worth naming: trixie cannot build this as pinned. The
# lever if that ever matters is the zbus pin, not this number. Arch, which is
# what the package targets, ships far newer.
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/agraves/ai-daemon"

[workspace.dependencies]
ai-daemon-proto = { path = "crates/ai-daemon-proto" }
ciborium = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zbus = { version = "5" }

[profile.release]
opt-level = 2
lto = false
codegen-units = 4
panic = "unwind"
strip = false
